<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plugga – Biologi 2</title>
    <meta name="description" content="Plugga: studieplattform för Biologi 2 – Växtfysiologi och cellbiologi. Lär dig, öva och testa dig själv. Dina framsteg sparas bara på din egen enhet." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d6b4f'/%3E%3Cpath d='M24 46V18h10.5a8.5 8.5 0 0 1 0 17H24' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("plugga:bio2-vaxtfys-cellbio-ht26");
          var t = raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme;
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <noscript>Plugga behöver JavaScript. Slå på JavaScript i webbläsaren och ladda om sidan.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
